<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Evaluator for Early Learning</title>
    <!-- Bootstrap CSS for quick, clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">AI Content Evaluator</span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Evaluate AI-Generated Educational Content</h3>
                        <p class="text-muted text-center">Upload a PDF, Word document, or paste text to evaluate its developmental appropriateness for Grades 1-3.</p>
                        
                        <!-- Input Form (Not functional yet, just UI) -->
                        <form>
                            <div class="mb-3">
                                <label for="textInput" class="form-label">Paste Text Here:</label>
                                <textarea class="form-control" id="textInput" rows="5" placeholder="Paste your AI-generated story or lesson plan here..."></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="fileInput" class="form-label">Or Upload a File (.pdf, .docx):</label>
                                <input class="form-control" type="file" id="fileInput" accept=".pdf,.docx,.txt">
                            </div>

                            <div class="d-grid">
                                <button type="button" class="btn btn-primary btn-lg" id="submitBtn">Evaluate Content</button>
                            </div>
                        </form>

                        <!-- Placeholder for Day 7 Results -->
                        <div id="resultsSection" class="mt-4" style="display: none;">
                            <hr>
                            <h4>Evaluation Results</h4>
                            <p>Results will appear here.</p>
                        </div>

                    </div>
                </div>
                <p class="text-center text-muted mt-3" style="font-size: 0.9rem;">
                    <em>Disclaimer: This tool is advisory. Professional teacher judgment is required.</em>
                </p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
